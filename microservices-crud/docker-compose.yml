version: "3.9"

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.d
    ports:
      - "80:80"
    depends_on:
      - frontend
      - gateway
    networks:
      - net

  frontend:
    build: ./frontend
    networks:
      - net

  gateway:
    build: ./gateway
    networks:
      - net
    depends_on:
      - users-service
      - products-service
    

  users-service:
    build: ./users-service
    networks:
      - net

  products-service:
    build: ./products-service
    networks:
      - net
