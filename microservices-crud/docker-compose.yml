version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - gateway

  frontend:
    build: ./frontend

  gateway:
    build: ./gateway
    depends_on:
      - users-service
      - products-service

  users-service:
    build: ./users-service

  products-service:
    build: ./products-service
