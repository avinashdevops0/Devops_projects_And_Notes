version: "3.9"

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - gateway

  frontend:
    build: ./frontend

  gateway:
    build: ./gateway
    depends_on:
      - users-service
      - products-service

  users-service:
    build: ./users-service

  products-service:
    build: ./products-service
