<!DOCTYPE html>
<html>
<head>
  <title>Microservices CRUD</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }

    h1 {
      color: #2c3e50;
      text-align: center;
    }

    h2 {
      color: #34495e;
      margin-top: 30px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    pre {
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      max-height: 300px;
    }

    #users, #products {
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<h1>Users & Products CRUD</h1>

<h2>Users</h2>
<button onclick="getUsers()">Load Users</button>
<pre id="users"></pre>

<h2>Products</h2>
<button onclick="getProducts()">Load Products</button>
<pre id="products"></pre>

<script>
const apiBase = '/api/v1';

async function getUsers() {
  const res = await fetch(`${apiBase}/users`);
  document.getElementById('users').textContent = JSON.stringify(await res.json(), null, 2);
}

async function getProducts() {
  const res = await fetch(`${apiBase}/products`);
  document.getElementById('products').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
