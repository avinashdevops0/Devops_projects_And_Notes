<!DOCTYPE html>
<html>
<head>
  <title>Microservices CRUD Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Microservices CRUD Dashboard</h1>

<div class="container">
  <!-- Users Section -->
  <div class="card">
    <h2>Users</h2>
    <button onclick="getUsers()">Load Users</button>
    <div id="users"><div class="spinner" style="display:none;"></div></div>
    <div id="users-error" class="error"></div>
  </div>

  <!-- Products Section -->
  <div class="card">
    <h2>Products</h2>
    <button onclick="getProducts()">Load Products</button>
    <div id="products"><div class="spinner" style="display:none;"></div></div>
    <div id="products-error" class="error"></div>
  </div>

  <!-- Orders Section -->
  <div class="card">
    <h2>Orders</h2>
    <button onclick="getOrders()">Load Orders</button>
    <div id="orders"><div class="spinner" style="display:none;"></div></div>
    <div id="orders-error" class="error"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
