version: "3.8"

services:
  mysql:
    build: ./database
    image: avinashg0/welcome-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - welcome-net

  backend:
    build: ./server
    image: avinashg0/welcome-be
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - welcome-net

  frontend:
    build: ./public
    image: avinashg0/welcome-fe
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - welcome-net

volumes:
  mysql_data:

networks:
  welcome-net:
