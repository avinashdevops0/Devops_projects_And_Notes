version: "3.8"

services:
  mysql:
    build: ./database
    image: avinashg0/welcome-db
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - welcome-net

  backend:
    build: ./server
    image: avinashg0/welcome-be
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - welcome-net

  frontend:
    build: ./public
    image: avinashg0/welcome-fe
    restart: unless-stopped

    ports:
      - "80:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - welcome-net

volumes:
  mysql_data:

networks:
  welcome-net:
